<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body{
            background-color: rgba(0, 89, 255, 0.493);
            color: white;
            font: Arial 18pt normal;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <Strong>DOM</Strong> em JavaScript</p>
    <div id="msg">Clique em mim</div>
    
    <script>
        window.document.write('Olá mundo')
        window.document.write('<br>Charset: ' + window.document.charset)
        window.document.write('<br>Navegador: ' + window.navigator.appName)
        window.document.write('<br>URL: ' + window.document.URL)

        var p1 = window.document.getElementsByTagName('p')[1]
        window.document.write('<br>Texto do parágrafo: ' + p1.innerText)
        window.document.write('<br>HTML do parágrafo: ' + p1.innerHTML.replace(/</g, '&lt;'))
        p1.style.color = 'yellow'

        var corpo = window.document.body

        var d = window.document.getElementById('msg')
        d.style.background = 'green'
        d.innerText = 'Estou aguardando'

    </script>
</body>
</html>
